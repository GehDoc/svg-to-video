name: 'Setup & Install'
description: 'Checks out code, sets up Node.js, and installs dependencies'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  registry-url:
    description: 'npm registry URL (e.g. https://registry.npmjs.org)'
    required: false
    default: ''
  install-playwright:
    description: 'Whether to install Playwright browsers'
    required: false
    default: 'false'
  install-ffmpeg:
    description: 'Whether to install FFmpeg'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Setup FFmpeg (Static)
      if: inputs.install-ffmpeg == 'true'
      run: |
        docker create --name static_ffmpeg mwader/static-ffmpeg:7.1
        sudo docker cp static_ffmpeg:/ffmpeg /usr/local/bin/ffmpeg
        sudo docker cp static_ffmpeg:/ffprobe /usr/local/bin/ffprobe
        docker rm static_ffmpeg
        sudo chmod 755 /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
      shell: bash

    - name: Install Playwright Browsers
      if: inputs.install-playwright == 'true'
      run: npx playwright install chromium --with-deps
      shell: bash
