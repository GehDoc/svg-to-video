name: 'Setup & Install'
description: 'Checks out code, sets up Node.js, and installs dependencies'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  registry-url:
    description: 'npm registry URL (e.g. https://registry.npmjs.org)'
    required: false
    default: ''
  install-playwright:
    description: 'Whether to install Playwright browsers'
    required: false
    default: 'false'
  install-ffmpeg:
    description: 'Whether to install FFmpeg'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Ensure FFmpeg
      if: inputs.install-ffmpeg == 'true'
      run: |
        if ! command -v ffmpeg &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
        fi
      shell: bash

    - name: Cache Playwright Browsers
      if: inputs.install-playwright == 'true'
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright OS Dependencies
      if: inputs.install-playwright == 'true'
      run: npx playwright install-deps chromium
      shell: bash

    - name: Install Playwright Browsers
      if: inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium
      shell: bash
