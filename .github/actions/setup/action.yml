name: 'Setup & Install'
description: 'Checks out code, sets up Node.js, and installs dependencies'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  registry-url:
    description: 'npm registry URL (e.g. https://registry.npmjs.org)'
    required: false
    default: ''
  install-playwright:
    description: 'Whether to install Playwright browsers'
    required: false
    default: 'false'
  install-ffmpeg:
    description: 'Whether to install FFmpeg'
    required: false
    default: 'false'
  install-chromium:
    description: 'Whether to install Chromium browser'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Install FFmpeg & Chromium
      if: inputs.install-ffmpeg == 'true' || inputs.install-chromium == 'true'
      run: |
        sudo apt-get update
        DEPS=""
        if [ "${{ inputs.install-ffmpeg }}" = "true" ]; then DEPS="$DEPS ffmpeg"; fi
        if [ "${{ inputs.install-chromium }}" = "true" ]; then DEPS="$DEPS chromium-browser"; fi
        sudo apt-get install -y $DEPS
      shell: bash

    - name: Cache Playwright Browsers
      if: inputs.install-playwright == 'true'
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}

    - name: Install Playwright Browsers
      if: inputs.install-playwright == 'true'
      run: npx playwright install chromium --with-deps
      shell: bash
