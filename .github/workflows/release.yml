name: Release Publication

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Verify Branch & CI Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Tag is on main Branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Error: Release tag must be created from the main branch."
            exit 1
          fi

      - name: Wait for CI Workflow to Pass on Main
        run: |
          RUN_ID=$(gh run list --workflow ci.yml --commit ${{ github.sha }} --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            echo "Watching CI workflow run $RUN_ID for commit ${{ github.sha }}..."
            gh run watch "$RUN_ID" --exit-status
          else
            echo "No active CI run found for commit ${{ github.sha }}, proceeding."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build JS Distribution & Assert Package Payload
        uses: ./.github/actions/npm-pack-check

      - name: Publish to npm Registry
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: Build & Push Docker Image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU (Multi-arch Docker)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Tag Name
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            gehdoc/svg-to-video:latest
            gehdoc/svg-to-video:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-mcp:
    name: Publish to MCP Registry (modelcontext.io)
    needs: [publish-npm, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Extract Release Version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Dynamically Update Version in mcp.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          echo "Injecting version $VERSION into mcp.json..."

          jq \
            --arg ver "$VERSION" \
            '.version = $ver |
            .packages |= map(
              if .registryType == "npm" then .version = $ver
              elif .registryType == "oci" then .identifier = (.identifier | sub(":.*$"; ":" + $ver))
              else . end
            )' mcp.json > mcp.json.tmp && mv mcp.json.tmp mcp.json

          echo "--- Updated mcp.json Preview ---"
          cat mcp.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          MAX_RETRIES=10
          RETRY_DELAY=60

          echo "Waiting ${RETRY_DELAY}s for npm package and Docker image propagation..."
          sleep $RETRY_DELAY

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt of $MAX_RETRIES: Publishing server to MCP Registry..."
            if ./mcp-publisher publish mcp.json; then
              echo "Successfully published server to MCP Registry!"
              exit 0
            fi

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "Publish failed. Waiting ${RETRY_DELAY}s for propagation before retrying..."
              sleep $RETRY_DELAY
            fi
          done

          echo "Error: Failed to publish server to MCP Registry after $MAX_RETRIES attempts."
          exit 1
