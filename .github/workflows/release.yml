name: Release Publication

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Release (npm & Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Tag is on main Branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Error: Release tag must be created from the main branch."
            exit 1
          fi

      - name: Wait for CI Workflow to Pass on Main
        run: |
          RUN_ID=$(gh run list --workflow ci.yml --commit ${{ github.sha }} --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            echo "Watching CI workflow run $RUN_ID for commit ${{ github.sha }}..."
            gh run watch "$RUN_ID" --exit-status
          else
            echo "No active CI run found for commit ${{ github.sha }}, proceeding."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build JS Distribution & Assert Package Payload
        uses: ./.github/actions/npm-pack-check

      - name: Publish to npm Registry
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up QEMU (Multi-arch Docker)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Tag Name
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            gehdoc/svg-to-video:latest
            gehdoc/svg-to-video:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish to MCP Registry
        uses: modelcontextprotocol/registry-action@v1
        with:
          manifest-path: 'mcp.json'
