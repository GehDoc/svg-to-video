name: Release Publication

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Release (npm & Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag is on main Branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Error: Release tag must be created from the main branch."
            exit 1
          fi

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'
          install-ffmpeg: 'true'
          install-chromium: 'true'

      - name: Run Full Validation & Package Snapshot Assertions
        run: npm run check
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      - name: Build JS Distribution
        run: npm run build

      - name: Publish to npm Registry
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up QEMU (Multi-arch Docker)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Tag Name
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            gehdoc/svg-to-video:latest
            gehdoc/svg-to-video:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
